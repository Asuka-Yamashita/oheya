<body>
<title>スイッチのおへや</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@700;900&display=swap">
<style>
  :root{ color-scheme: light; --bg:#2b3440; --bar:#1d252e; --ink:#24323f; }
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); overflow:hidden;
    font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN",sans-serif;
    touch-action:manipulation; user-select:none; -webkit-user-select:none;
    display:flex; flex-direction:column;
  }
  #scenes{flex:1; min-height:0; display:flex; align-items:center; justify-content:center;}
  svg.scene{width:100%; height:100%; max-width:100%; display:block; overflow:hidden;}
  svg.scene[hidden]{display:none!important;}
  #tabs{
    display:flex; gap:6px; padding:8px 8px calc(env(safe-area-inset-bottom,0px) + 8px);
    background:var(--bar); overflow-x:auto; scrollbar-width:none;
  }
  #tabs::-webkit-scrollbar{display:none;}
  .tab{
    flex:1 0 64px; border:0; border-radius:14px; background:#34404d; color:#e6edf3;
    font:inherit; font-weight:900; font-size:11px; padding:6px 4px 7px; white-space:nowrap; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; gap:2px; line-height:1;
  }
  .tab .ic{font-size:26px; font-family:system-ui,"Apple Color Emoji","Segoe UI Emoji";}
  .tab[aria-selected="true"]{background:#ffcc33; color:var(--ink);}
  .tab:focus-visible{outline:3px solid #ffcc33; outline-offset:2px;}
  .btn{cursor:pointer;}
  .btn:focus-visible .cap{stroke:#ffcc33; stroke-width:4;}
  .noclick{pointer-events:none;}
  .btn *{pointer-events:auto;}
  text{font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN",sans-serif; font-weight:900; pointer-events:none;}
  text.seg{font-family:"Courier New",monospace; font-weight:700; letter-spacing:.06em;}
</style>

<div id="scenes"></div>
<div id="tabs" role="tablist"></div>

<script>
(() => {
  const NS = 'http://www.w3.org/2000/svg';
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const el = (tag, attrs = {}, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
  const txt = (parent, x, y, s, size = 14, fill = '#24323f', extra = {}) => { const t = el('text', { x, y, 'font-size': size, fill, 'text-anchor': 'middle', ...extra }, parent); t.textContent = s; return t; };

  // ================= sound =================
  let ac = null, noise = null, noiseF = null, noiseG = null;
  function audio() {
    try {
      if (!ac) {
        ac = new (window.AudioContext || window.webkitAudioContext)();
        const len = ac.sampleRate * 2, buf = ac.createBuffer(1, len, ac.sampleRate), d = buf.getChannelData(0);
        for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
        noise = ac.createBufferSource(); noise.buffer = buf; noise.loop = true;
        noiseF = ac.createBiquadFilter(); noiseF.type = 'lowpass'; noiseF.frequency.value = 300;
        noiseG = ac.createGain(); noiseG.gain.value = 0;
        noise.connect(noiseF).connect(noiseG).connect(ac.destination); noise.start();
      }
      if (ac.state === 'suspended') ac.resume();
    } catch (e) {}
    return ac;
  }
  function tone(freq, len = .08, vol = .25, type = 'square', slide) {
    const a = audio(); if (!a) return;
    const t = a.currentTime, o = a.createOscillator(), g = a.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + len);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + len + .02);
    o.connect(g).connect(a.destination); o.start(t); o.stop(t + len + .03);
  }
  const click = (f = 1500) => tone(f, .04, .3, 'square', f / 3);
  const beep = (f = 2200, l = .12) => tone(f, l, .2, 'sine');
  function melody(notes, gap = .12) {
    const a = audio(); if (!a) return;
    notes.forEach((f, i) => { const t = a.currentTime + i * gap, o = a.createOscillator(), g = a.createGain(); o.type = 'sine'; o.frequency.value = f; g.gain.setValueAtTime(.18, t); g.gain.exponentialRampToValueAtTime(.001, t + gap * 1.8); o.connect(g).connect(a.destination); o.start(t); o.stop(t + gap * 1.9); });
  }
  // shared motor/wind noise: only the active scene sets it
  let noiseWant = { gain: 0, freq: 300 };
  function setNoise(gain, freq) { noiseWant = { gain, freq }; }
  document.addEventListener('pointerdown', audio, { once: true });

  // ================= scene framework =================
  const scenesRoot = document.getElementById('scenes'), tabsRoot = document.getElementById('tabs');
  const scenes = []; let active = null;
  function scene(name, icon, build) {
    const svg = el('svg', { class: 'scene', viewBox: '0 0 360 560', preserveAspectRatio: 'xMidYMid meet', 'aria-label': name }, scenesRoot);
    const s = { name, svg, tick: () => {}, enter: () => {}, leave: () => {} };
    build(s);
    const tab = document.createElement('button');
    tab.className = 'tab'; tab.setAttribute('role', 'tab'); tab.type = 'button';
    tab.innerHTML = `<span class="ic">${icon}</span><span>${name}</span>`;
    tab.addEventListener('click', () => show(s));
    tabsRoot.appendChild(tab); s.tab = tab; scenes.push(s);
    svg.setAttribute('hidden','');
    return s;
  }
  function show(s) {
    if (active === s) return;
    if (active) { active.svg.setAttribute('hidden',''); active.tab.setAttribute('aria-selected', 'false'); active.leave(); }
    active = s; s.svg.removeAttribute('hidden'); s.tab.setAttribute('aria-selected', 'true'); setNoise(0, 300); s.enter(); click(1100);
    try { localStorage.setItem('oheya-tab', s.name); } catch (e) {}
  }
  // big push button helper
  function pushBtn(parent, { x, y, w = 52, h = 44, label, sub, color = '#fff', on, size = 20 }) {
    const g = el('g', { class: 'btn', tabindex: '0', role: 'button', 'aria-label': sub || label }, parent);
    el('rect', { x, y: y + 6, width: w, height: h, rx: 10, fill: '#9aa7b3' }, g);
    const cap = el('rect', { class: 'cap', x, y, width: w, height: h, rx: 10, fill: color }, g);
    const t1 = txt(g, x + w / 2, y + (sub ? h * .6 : h * .66), label, size);
    const t2 = sub ? txt(g, x + w / 2, y + h * .92, sub, 9, '#4c5d6b') : null;
    const b = { g, cap, down(o) { const d = o ? 5 : 0; cap.setAttribute('y', y + d); t1.setAttribute('y', y + (sub ? h * .6 : h * .66) + d); t2 && t2.setAttribute('y', y + h * .92 + d); } };
    const fire = e => { e.preventDefault(); on(b); };
    g.addEventListener('pointerdown', fire);
    g.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') fire(e); });
    return b;
  }
  const led = (parent, cx, cy) => el('circle', { cx, cy, r: 4, fill: '#3a4550' }, parent);
  const ledOn = (l, on, c = '#48d36b') => l.setAttribute('fill', on ? c : '#3a4550');
  function room(svg, wall = '#dfeee9', floorY = 400) {
    el('rect', { x: 0, y: 0, width: 360, height: 560, fill: wall }, svg);
    el('rect', { x: 0, y: floorY, width: 360, height: 560 - floorY, fill: '#c98f5a' }, svg);
    for (let y = floorY + 20; y < 560; y += 22) el('line', { x1: 0, y1: y, x2: 360, y2: y, stroke: '#a9713f', 'stroke-width': 2 }, svg);
    el('rect', { x: 0, y: floorY - 8, width: 360, height: 10, fill: '#8a5a33' }, svg);
  }

  // ================= 1. 扇風機 =================

    txt(svg, 90, 385, '🧸', 34, '#000', { 'font-family': 'system-ui,"Apple Color Emoji","Segoe UI Emoji"' });
    // wall switch
    const wallSw = el('g', { class: 'btn', tabindex: '0', role: 'button', 'aria-label': 'かべのスイッチ' }, svg);
    el('rect', { x: 150, y: 226, width: 50, height: 78, rx: 6, fill: '#fbfbf7', stroke: '#b9c2bd', 'stroke-width': 2 }, wallSw);
    el('rect', { x: 162, y: 240, width: 26, height: 50, rx: 4, fill: '#e8ece9', stroke: '#aab3ae', 'stroke-width': 1.5 }, wallSw);
    const rocker = el('rect', { x: 164, y: 242, width: 22, height: 24, rx: 3, fill: '#fff', stroke: '#9aa39e', 'stroke-width': 1.5 }, wallSw);
    const swLed = el('circle', { cx: 175, cy: 282, r: 3, fill: '#48d36b' }, wallSw);
    // darkness + glows
    const dark = el('rect', { x: 0, y: 0, width: 360, height: 560, fill: '#0c1424', 'fill-opacity': 0, class: 'noclick' }, svg);
    const defs = el('defs', {}, svg);
    const g1 = el('radialGradient', { id: 'lightGlow', cx: '50%', cy: '0%', r: '90%' }, defs); el('stop', { offset: 0, 'stop-color': '#fff6c8', 'stop-opacity': .75 }, g1); el('stop', { offset: .6, 'stop-color': '#fff6c8', 'stop-opacity': .12 }, g1); el('stop', { offset: 1, 'stop-color': '#fff6c8', 'stop-opacity': 0 }, g1);
    const g2 = el('radialGradient', { id: 'nightGlow2', cx: '50%', cy: '6%', r: '45%' }, defs); el('stop', { offset: 0, 'stop-color': '#ff9a3c', 'stop-opacity': .55 }, g2); el('stop', { offset: 1, 'stop-color': '#ff9a3c', 'stop-opacity': 0 }, g2);
    const g3 = el('radialGradient', { id: 'lampGlow2', cx: '78%', cy: '52%', r: '35%' }, defs); el('stop', { offset: 0, 'stop-color': '#ffd98a', 'stop-opacity': .6 }, g3); el('stop', { offset: 1, 'stop-color': '#ffd98a', 'stop-opacity': 0 }, g3);
    const cone = el('rect', { x: 0, y: 0, width: 360, height: 560, fill: 'url(#lightGlow)', class: 'noclick' }, svg);
    const night = el('rect', { x: 0, y: 0, width: 360, height: 560, fill: 'url(#nightGlow2)', opacity: 0, class: 'noclick' }, svg);
    const lampCone = el('rect', { x: 0, y: 0, width: 360, height: 560, fill: 'url(#lampGlow2)', opacity: 0, class: 'noclick' }, svg);
    // ceiling light (above darkness)
    el('rect', { x: 160, y: 0, width: 40, height: 16, rx: 4, fill: '#d9ddd6', class: 'noclick' }, svg);
    const shadeC = el('ellipse', { cx: 180, cy: 32, rx: 96, ry: 24, fill: '#fffdf0', stroke: '#d8d2b8', 'stroke-width': 2, class: 'noclick' }, svg);
    const bulbN = el('circle', { cx: 180, cy: 36, r: 7, fill: '#ff9a3c', opacity: 0, class: 'noclick' }, svg);
    const pull = el('g', { class: 'btn', tabindex: '0', role: 'button', 'aria-label': 'でんきのひも' }, svg);
    el('rect', { x: 160, y: 50, width: 40, height: 140, fill: 'transparent' }, pull);
    const cord = el('line', { x1: 180, y1: 52, x2: 180, y2: 150, stroke: '#c9c1a3', 'stroke-width': 2.5 }, pull);
    const knob = el('rect', { x: 172, y: 146, width: 16, height: 26, rx: 8, fill: '#ffcf4a', stroke: '#c99a1a', 'stroke-width': 2 }, pull);
    const hint = txt(svg, 214, 166, '← ひっぱってね', 15, '#3b5260', { 'text-anchor': 'start' });
    // control panel
    el('rect', { x: 20, y: 420, width: 320, height: 128, rx: 20, fill: '#f4f7fa', stroke: '#b7c2cb', 'stroke-width': 2.5 }, svg);
    let mode = 0, wallOn = true, lampOn = false, pulling = false, dim = 1;
    const fire = (g, fn) => { g.addEventListener('pointerdown', e => { e.preventDefault(); fn(); }); g.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fn(); } }); };
    function render() {
      const on = wallOn ? mode : 2;
      cone.setAttribute('opacity', on === 0 ? dim : 0);
      dark.setAttribute('fill-opacity', on === 0 ? (1 - dim) * .6 : on === 1 ? .62 : .82);
      night.setAttribute('opacity', on === 1 ? 1 : 0); bulbN.setAttribute('opacity', on === 1 ? 1 : 0);
      shadeC.setAttribute('fill', on === 0 ? '#fffdf0' : on === 1 ? '#8a7f6a' : '#5a6070');
      rocker.setAttribute('y', wallOn ? 242 : 264); swLed.setAttribute('fill', wallOn ? '#48d36b' : '#ff7043');
      hint.setAttribute('fill', on === 0 ? '#3b5260' : '#e9eef2');
      lampCone.setAttribute('opacity', lampOn ? 1 : 0); lampBulb.setAttribute('opacity', lampOn ? 1 : 0); lampGlow.setAttribute('opacity', lampOn ? .5 : 0); shade.setAttribute('fill', lampOn ? '#ffb06a' : '#ff8c5a');
      lampKnob.setAttribute('cx', lampOn ? 239 : 231);
      wb.g.querySelector('text').textContent = wallOn ? 'ON' : 'OFF'; wb.down(wallOn); lb.down(lampOn);
      dimT.textContent = ['くらい', 'ふつう', 'あかるい'][dim < .5 ? 0 : dim < .9 ? 1 : 2];
    }
    function doPull() {
      if (pulling) return; pulling = true; hint.style.display = 'none';
      const t0 = performance.now(); let fired = false;
      const step = t => { const p = Math.min(1, (t - t0) / 320), d = Math.sin(p * Math.PI) * 26; cord.setAttribute('y2', 150 + d); knob.setAttribute('transform', `translate(0 ${d})`); if (p >= .5 && !fired) { fired = true; mode = (mode + 1) % 3; click(2400); render(); } if (p < 1) requestAnimationFrame(step); else pulling = false; };
      requestAnimationFrame(step);
    }
    fire(pull, doPull);
    fire(wallSw, () => { wallOn = !wallOn; click(600); render(); });
    fire(lampSw, () => { lampOn = !lampOn; click(1300); render(); });
    const pb = pushBtn(svg, { x: 34, y: 432, w: 70, h: 46, label: 'ひも', sub: 'ひっぱる', color: '#fff6c8', size: 15, on: doPull });
    const wb = pushBtn(svg, { x: 114, y: 432, w: 70, h: 46, label: 'ON', sub: 'かべスイッチ', color: '#c6f2d5', size: 15, on: () => { wallOn = !wallOn; click(600); render(); } });
    const lb = pushBtn(svg, { x: 194, y: 432, w: 70, h: 46, label: 'スタンド', sub: 'つくえのでんき', color: '#ffe0d6', size: 12, on: () => { lampOn = !lampOn; click(1300); render(); } });
    pushBtn(svg, { x: 274, y: 432, w: 56, h: 46, label: '☀', sub: 'ぜんぶ', size: 18, color: '#fff', on: () => { wallOn = true; mode = 0; lampOn = true; dim = 1; click(1500); render(); } });
    txt(svg, 180, 500, 'あかるさ', 11, '#4c5d6b');
    pushBtn(svg, { x: 34, y: 490, w: 60, h: 44, label: '−', size: 26, color: '#dff1ff', on: () => { dim = Math.max(.25, dim - .25); beep(1500, .06); render(); } });
    const dimT = txt(svg, 180, 524, 'あかるい', 16, '#24323f');
    pushBtn(svg, { x: 266, y: 490, w: 60, h: 44, label: '＋', size: 26, color: '#ffe0d6', on: () => { dim = Math.min(1, dim + .25); beep(1900, .06); render(); } });
    render();
    s.tick = () => { setNoise(0, 300); };
  });

  // ================= 11. かべかけせんぷうき =================
  scene('かべ扇風機', '🪭', s => {
    const svg = s.svg; room(svg, '#eaf3ee', 430);
    el('rect', { x: 0, y: 0, width: 360, height: 14, fill: '#f7f7f2' }, svg);
    // poster on wall
    el('rect', { x: 30, y: 300, width: 80, height: 100, rx: 6, fill: '#fff', stroke: '#cfd8e0', 'stroke-width': 3 }, svg);
    txt(svg, 70, 362, '🚂', 40, '#000', { 'font-family': 'system-ui,"Apple Color Emoji","Segoe UI Emoji"' });
    // paper streamers hanging near the fan so wind is visible
    const streamers = [60, 300].map((x, i) => ({ x, p: el('path', { fill: 'none', stroke: i ? '#34c46a' : '#ff4d5e', 'stroke-width': 6, 'stroke-linecap': 'round' }, svg) }));
    // bracket
    el('rect', { x: 150, y: 30, width: 60, height: 28, rx: 6, fill: '#cfd8e0', stroke: '#9aa7b3', 'stroke-width': 2 }, svg);
    el('circle', { cx: 160, cy: 44, r: 3, fill: '#5b6c7a' }, svg); el('circle', { cx: 200, cy: 44, r: 3, fill: '#5b6c7a' }, svg);
    el('rect', { x: 172, y: 58, width: 16, height: 40, rx: 6, fill: '#dfe6ec', stroke: '#b7c2cb', 'stroke-width': 2 }, svg);
    const head = el('g', {}, svg);
    const CX = 180, CY = 190;
    el('rect', { x: CX - 12, y: 90, width: 24, height: 40, rx: 8, fill: '#dfe6ec' }, head);
    el('circle', { cx: CX, cy: CY, r: 88, fill: '#fff', 'fill-opacity': .25 }, head);
    const blades = el('g', { transform: `translate(${CX} ${CY})` }, head);
    const bladeSet = el('g', {}, blades);
    for (let i = 0; i < 3; i++) el('path', { d: 'M0 -14 C 30 -44, 72 -34, 74 -4 C 58 12, 20 8, 0 14 Z', fill: '#9ad0a4', 'fill-opacity': .88, stroke: '#5f9b6c', 'stroke-width': 1.5, transform: `rotate(${i * 120})` }, bladeSet);
    const blur = el('circle', { r: 74, fill: '#9ad0a4', 'fill-opacity': 0 }, blades);
    el('circle', { r: 16, fill: '#5f9b6c' }, blades); el('circle', { r: 6, fill: '#e3f2e6' }, blades);
    const guard = el('g', { fill: 'none', stroke: '#9aa7b3', 'stroke-width': 2 }, head);
    [88, 58, 30].forEach(r => el('circle', { cx: CX, cy: CY, r }, guard));
    for (let i = 0; i < 16; i++) { const a = i * Math.PI / 8; el('line', { x1: CX + Math.cos(a) * 18, y1: CY + Math.sin(a) * 18, x2: CX + Math.cos(a) * 88, y2: CY + Math.sin(a) * 88 }, guard); }
    el('circle', { cx: CX, cy: CY, r: 88, fill: 'none', stroke: '#7d8b98', 'stroke-width': 5 }, head);
    // two pull strings under the fan (real wall fans have them)
    const strings = [{ x: CX - 22, label: 'つよさ', col: '#ffcf4a' }, { x: CX + 22, label: 'くびふり', col: '#7cc7f2' }].map(st => {
      const g = el('g', { class: 'btn', tabindex: '0', role: 'button', 'aria-label': st.label + 'のひも' }, head);
      el('rect', { x: st.x - 16, y: CY + 88, width: 32, height: 110, fill: 'transparent' }, g);
      const line = el('line', { x1: st.x, y1: CY + 86, x2: st.x, y2: CY + 160, stroke: '#c9c1a3', 'stroke-width': 2.5 }, g);
      const knob = el('rect', { x: st.x - 7, y: CY + 156, width: 14, height: 24, rx: 7, fill: st.col, stroke: '#8a7a3a', 'stroke-width': 2 }, g);
      txt(g, st.x, CY + 196, st.label, 10, '#4c5d6b');
      return { ...st, g, line, knob, pulling: false };
    });
    el('rect', { x: 22, y: 448, width: 316, height: 100, rx: 24, fill: '#f4f7fa', stroke: '#b7c2cb', 'stroke-width': 2.5 }, svg);
    const LV = [['切', 'きる', 0], ['弱', 'よわ', 9], ['中', 'ちゅう', 16], ['強', 'つよ', 26]];
    let level = 0, target = 0, omega = 0, ang = 0, swing = false, sp = 0, sa = 0, time = 0, tilt = 0;
    const leds = [], btns = [];
    LV.forEach(([k, sub], i) => { btns.push(pushBtn(svg, { x: 36 + i * 58, y: 462, label: k, sub, color: i === 0 ? '#ffd9d9' : '#fff', on: () => setLevel(i) })); leds.push(led(svg, 62 + i * 58, 456)); });
    const swb = pushBtn(svg, { x: 272, y: 462, label: '首', sub: 'くびふり', color: '#dff1ff', on: () => toggleSwing() });
    const swl = led(svg, 298, 456);
    txt(svg, 180, 534, 'ひもを ひっぱっても うごくよ', 12, '#4c5d6b');
    function setLevel(i) { click(i ? 1500 : 900); level = i; target = LV[i][2]; btns.forEach((b, j) => { b.down(j === i && i); ledOn(leds[j], j === i && i); }); if (!i) { swing = false; swb.down(false); ledOn(swl, false); } }
    function toggleSwing() { if (!level) { click(700); return; } click(1200); swing = !swing; swb.down(swing); ledOn(swl, swing, '#ffa726'); }
    function pullString(st, fn) {
      if (st.pulling) return; st.pulling = true; const t0 = performance.now(); let fired = false;
      const step = t => { const p = Math.min(1, (t - t0) / 300), d = Math.sin(p * Math.PI) * 22; st.line.setAttribute('y2', CY + 160 + d); st.knob.setAttribute('transform', `translate(0 ${d})`); if (p >= .5 && !fired) { fired = true; tone(2600, .03, .25, 'square', 900); fn(); } if (p < 1) requestAnimationFrame(step); else st.pulling = false; };
      requestAnimationFrame(step);
    }
    const fire = (g, fn) => { g.addEventListener('pointerdown', e => { e.preventDefault(); fn(); }); g.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fn(); } }); };
    fire(strings[0].g, () => pullString(strings[0], () => setLevel((level + 1) % 4)));
    fire(strings[1].g, () => pullString(strings[1], toggleSwing));
    s.tick = dt => {
      time += dt;
      omega += (target - omega) * Math.min(1, (target > omega ? 1.6 : .55) * dt);
      ang += omega * dt * (reduce ? .4 : 1);
      bladeSet.setAttribute('transform', `rotate(${ang * 57.3})`);
      blur.setAttribute('fill-opacity', Math.max(0, Math.min(.45, (omega - 8) / 40)));
      sa += ((swing ? 1 : 0) - sa) * Math.min(1, dt * 1.5); if (sa > .001) sp += dt * .9;
      const a = Math.sin(sp) * .8 * sa;
      head.setAttribute('transform', `translate(${CX + Math.sin(a) * 30} ${CY}) scale(${.7 + .3 * Math.cos(a)} 1) translate(${-CX} ${-CY})`);
      const wind = omega / 26;
      streamers.forEach((st, i) => {
        const side = i ? 1 : -1, facing = Math.max(0, .35 + side * Math.sin(a) * .9);
        const push = wind * facing, flap = Math.sin(time * (5 + wind * 16) + i * 2) * (3 + push * 14);
        const x0 = st.x, y0 = 60, len = 130;
        const ex = x0 + side * push * 80 + flap, ey = y0 + len * (1 - push * .35);
        st.p.setAttribute('d', `M${x0} ${y0} Q ${x0 + side * push * 20 - flap} ${y0 + len * .5} ${ex} ${ey}`);
      });
      setNoise(Math.min(.12, wind * .12), 200 + wind * 700);
    };
  });

  // ================= 12. とけい =================
  scene('とけい', '⏰', s => {
    const svg = s.svg; room(svg, '#f4efe6', 430);
    // wall clock body
    el('rect', { x: 168, y: 20, width: 24, height: 16, fill: '#8a5a33' }, svg);
    el('circle', { cx: 180, cy: 180, r: 128, fill: '#8a5a33' }, svg);
    el('circle', { cx: 180, cy: 180, r: 116, fill: '#fffdf5', stroke: '#d8c9a8', 'stroke-width': 2 }, svg);
    for (let i = 0; i < 60; i++) { const a = i * Math.PI / 30, big = i % 5 === 0; el('line', { x1: 180 + Math.sin(a) * (big ? 98 : 104), y1: 180 - Math.cos(a) * (big ? 98 : 104), x2: 180 + Math.sin(a) * 110, y2: 180 - Math.cos(a) * 110, stroke: big ? '#24323f' : '#b9c2cb', 'stroke-width': big ? 3 : 1.5 }, svg); }
    for (let h = 1; h <= 12; h++) { const a = h * Math.PI / 6; txt(svg, 180 + Math.sin(a) * 84, 180 - Math.cos(a) * 84 + 8, h, 22, '#24323f'); }
    // cuckoo door
    const door = el('g', {}, svg);
    el('rect', { x: 164, y: 110, width: 32, height: 30, rx: 4, fill: '#c98f5a', stroke: '#8a5a33', 'stroke-width': 2 }, door);
    const bird = txt(svg, 180, 134, '🐦', 22, '#000', { 'font-family': 'system-ui,"Apple Color Emoji","Segoe UI Emoji"', opacity: 0 });
    const hH = el('line', { x1: 180, y1: 180, x2: 180, y2: 120, stroke: '#24323f', 'stroke-width': 8, 'stroke-linecap': 'round' }, svg);
    const hM = el('line', { x1: 180, y1: 180, x2: 180, y2: 92, stroke: '#24323f', 'stroke-width': 5, 'stroke-linecap': 'round' }, svg);
    const hS = el('line', { x1: 180, y1: 196, x2: 180, y2: 84, stroke: '#e4572e', 'stroke-width': 2, 'stroke-linecap': 'round' }, svg);
    el('circle', { cx: 180, cy: 180, r: 7, fill: '#e4572e' }, svg);
    // pendulum
    const pend = el('g', {}, svg);
    el('line', { x1: 180, y1: 300, x2: 180, y2: 380, stroke: '#b8961e', 'stroke-width': 4 }, pend);
    el('circle', { cx: 180, cy: 388, r: 16, fill: '#ffcf4a', stroke: '#b8961e', 'stroke-width': 3 }, pend);
    // digital
    el('rect', { x: 30, y: 320, width: 118, height: 50, rx: 8, fill: '#1d2a36' }, svg);
    const dig = txt(svg, 89, 353, '00:00', 26, '#48ffa0', { class: 'seg' });
    const ampm = txt(svg, 89, 316, '', 11, '#4c5d6b');
    // reading in words
    const words = txt(svg, 262, 350, '', 18, '#24323f');
    // panel
    el('rect', { x: 20, y: 444, width: 320, height: 104, rx: 20, fill: '#f4f7fa', stroke: '#b7c2cb', 'stroke-width': 2.5 }, svg);
    let live = true, offset = 0, fast = 0, time = 0, tickT = 0, lastMin = -1, lastHour = -1, cuckooT = -1, tickOn = true, playMs = Date.now();
    const nowMs = () => live ? Date.now() : playMs;
    const lb = pushBtn(svg, { x: 32, y: 456, w: 66, h: 40, label: 'いま', sub: 'ほんとうのじかん', color: '#c6f2d5', size: 15, on: () => { click(1400); live = true; fast = 0; render(); } });
    pushBtn(svg, { x: 106, y: 456, w: 56, h: 40, label: '+1じ', color: '#dff1ff', size: 14, on: () => { click(1500); toPlay(); playMs += 3600000; render(); } });
    pushBtn(svg, { x: 170, y: 456, w: 56, h: 40, label: '+5ふん', color: '#dff1ff', size: 12, on: () => { click(1500); toPlay(); playMs += 300000; render(); } });
    const fb = pushBtn(svg, { x: 234, y: 456, w: 96, h: 40, label: 'はやまわし', color: '#fff6c8', size: 13, on: () => { click(1300); toPlay(); fast = fast ? 0 : 600; fb.down(!!fast); } });
    const tb = pushBtn(svg, { x: 32, y: 502, w: 90, h: 38, label: 'カチカチ', sub: 'おと', color: '#fff', size: 12, on: () => { tickOn = !tickOn; click(1200); tb.down(tickOn); } }); tb.down(true);
    pushBtn(svg, { x: 130, y: 502, w: 90, h: 38, label: 'ポッポー', sub: 'はとどけい', color: '#ffe0d6', size: 12, on: () => cuckoo() });
    pushBtn(svg, { x: 228, y: 502, w: 102, h: 38, label: 'ボーン', sub: 'かねのおと', color: '#fff', size: 12, on: () => chime() });
    function toPlay() { if (live) { playMs = Date.now(); live = false; } }
    function cuckoo() { if (cuckooT >= 0) return; cuckooT = 0; }
    function chime() { const a = audio(); if (!a) return; [0, .5, 1].forEach(d => { const t = a.currentTime + d, o = a.createOscillator(), g = a.createGain(); o.type = 'sine'; o.frequency.value = 330; g.gain.setValueAtTime(.3, t); g.gain.exponentialRampToValueAtTime(.001, t + 1.2); o.connect(g).connect(a.destination); o.start(t); o.stop(t + 1.3); }); }
    function render() {
      const d = new Date(nowMs()), h = d.getHours(), m = d.getMinutes(), sec = d.getSeconds() + d.getMilliseconds() / 1000;
      const ah = ((h % 12) + m / 60) * 30, am = (m + sec / 60) * 6, as = (live ? Math.floor(sec) : sec) * 6;
      hH.setAttribute('transform', `rotate(${ah} 180 180)`); hM.setAttribute('transform', `rotate(${am} 180 180)`); hS.setAttribute('transform', `rotate(${as} 180 180)`);
      dig.textContent = String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0');
      ampm.textContent = h < 12 ? 'ごぜん' : 'ごご';
      const h12 = h % 12 === 0 ? 12 : h % 12;
      words.textContent = `${h12}じ${m === 0 ? '' : m === 30 ? 'はん' : m + 'ふん'}`;
      lb.down(live);
      if (m !== lastMin) { if (lastMin >= 0 && m === 0) { cuckoo(); } lastMin = m; }
    }
    render();
    s.tick = dt => {
      time += dt;
      if (!live && fast) playMs += dt * 1000 * fast;
      render();
      pend.setAttribute('transform', `rotate(${Math.sin(time * Math.PI) * 12} 180 300)`);
      if (tickOn) { tickT += dt; if (tickT >= 1) { tickT -= 1; tone(2200, .015, .08, 'square', 800); } }
      if (cuckooT >= 0) {
        cuckooT += dt;
        const o = cuckooT < 2.4 ? 1 : 0; bird.setAttribute('opacity', o); door.setAttribute('transform', o ? 'translate(-22 0)' : '');
        bird.setAttribute('y', 134 - Math.abs(Math.sin(cuckooT * 6)) * 6);
        if (cuckooT > .1 && cuckooT < .2) { tone(880, .18, .2, 'sine', 700); }
        if (cuckooT > .8 && cuckooT < .9) { tone(880, .18, .2, 'sine', 700); }
        if (cuckooT > 1.6 && cuckooT < 1.7) { tone(880, .18, .2, 'sine', 700); }
        if (cuckooT > 2.6) cuckooT = -1;
      }
      setNoise(0, 300);
    };
  });

  // ================= loop =================
  let last = performance.now();
  function frame(t) {
    const dt = Math.min(.05, (t - last) / 1000); last = t;
    if (active) active.tick(dt);
    if (noiseG && ac) { noiseG.gain.setTargetAtTime(noiseWant.gain, ac.currentTime, .08); noiseF.frequency.setTargetAtTime(noiseWant.freq, ac.currentTime, .08); }
    requestAnimationFrame(frame);
  }
  let first = scenes[0];
  try { const n = localStorage.getItem('oheya-tab'); const f = scenes.find(s => s.name === n); if (f) first = f; } catch (e) {}
  show(first);
  requestAnimationFrame(frame);
})();
</script>

<script>
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}
</script>
