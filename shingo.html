<body>
<title>くるまの信号機</title>
<style>
  :root{ color-scheme: dark; --bg:#0c0e11; --panel:#1b1f24; --ink:#e8edf2; --muted:#8c96a0; --on:#ffcc33; }
  html,body{height:100%;}
  body{margin:0; background:var(--bg); color:var(--ink); overflow:hidden; touch-action:manipulation; user-select:none; -webkit-user-select:none;
    font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",system-ui,sans-serif;}
  #cv{position:fixed; inset:0; width:100%; height:100%; display:block;}
  #bar{
    position:fixed; left:0; right:0; bottom:0; z-index:2;
    padding:10px 16px calc(env(safe-area-inset-bottom,0px) + 12px);
    background:linear-gradient(to top, rgba(12,14,17,.96), rgba(12,14,17,.85));
    display:flex; flex-wrap:wrap; gap:8px; justify-content:center;
    transition:transform .3s, opacity .3s;
  }
  #bar.hide{transform:translateY(100%); opacity:0; pointer-events:none;}
  #bar button{
    font:inherit; font-weight:800; font-size:15px; color:var(--ink);
    background:var(--panel); border:1px solid #333a42; border-radius:12px;
    padding:10px 14px; min-height:44px; cursor:pointer;
  }
  #bar button[aria-pressed="true"]{background:var(--on); color:#1b1f24; border-color:var(--on);}
  #bar button:focus-visible{outline:3px solid var(--on); outline-offset:2px;}
  #hint{position:fixed; top:calc(env(safe-area-inset-top,0px) + 12px); left:0; right:0; text-align:center; font-size:13px; color:var(--muted); pointer-events:none; transition:opacity .4s;}
  @media (prefers-reduced-motion: reduce){ #bar{transition:none;} }
</style>

<canvas id="cv" aria-label="くるまの信号機"></canvas>
<div id="hint">しんごうを タップ → いろが かわる</div>
<div id="bar">
  <button id="bAuto" type="button" aria-pressed="true">じどう</button>
  <button id="bSpeed" type="button">はやさ：ふつう</button>
  <button id="bArrow" type="button" aria-pressed="false">やじるし</button>
  <button id="bShape" type="button">かたち：じどう</button>
  <button id="bG" type="button">あお</button>
  <button id="bY" type="button">きいろ</button>
  <button id="bR" type="button">あか</button>
  <button id="bFull" type="button">ぜんがめん</button>
</div>

<script>
(() => {
  const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
  const bar = document.getElementById('bar'), hint = document.getElementById('hint');
  const $ = id => document.getElementById(id);
  // Japanese LED colours
  const COL = {
    green:  { on: '#00e0b8', core: '#b9fff0', dim: '#0b3a33' },
    yellow: { on: '#ffb000', core: '#fff0b8', dim: '#3b2a05' },
    red:    { on: '#ff2a18', core: '#ffc9bf', dim: '#3a0d09' }
  };
  const SPEEDS = [
    { name: 'ゆっくり', g: 16, y: 4, r: 16, a: 5 },
    { name: 'ふつう',   g: 10, y: 3, r: 10, a: 4 },
    { name: 'はやい',   g: 5,  y: 2, r: 5,  a: 3 }
  ];
  let speed = 1, auto = true, arrowOn = false, shape = 'auto'; // auto | h | v
  let state = 'green', t = 0, fade = 1;
  let W = 0, H = 0, dpr = 1, layout = null;

  // ---------- LED dot sprite cache ----------
  const spriteCache = {};
  function lampSprite(kind, r, lit) {
    const key = kind + '|' + Math.round(r) + '|' + lit;
    if (spriteCache[key]) return spriteCache[key];
    const pad = r * 1.1, size = Math.ceil((r + pad) * 2 * dpr);
    const c = document.createElement('canvas'); c.width = c.height = size;
    const g = c.getContext('2d'); g.scale(dpr, dpr);
    const cx = r + pad, cy = r + pad, C = COL[kind];
    if (lit) {
      // bloom
      const bloom = g.createRadialGradient(cx, cy, r * .6, cx, cy, r + pad);
      bloom.addColorStop(0, hexA(C.on, .55)); bloom.addColorStop(.5, hexA(C.on, .16)); bloom.addColorStop(1, hexA(C.on, 0));
      g.fillStyle = bloom; g.beginPath(); g.arc(cx, cy, r + pad, 0, 7); g.fill();
    }
    // lens base
    const base = g.createRadialGradient(cx - r * .2, cy - r * .25, r * .1, cx, cy, r);
    if (lit) { base.addColorStop(0, C.core); base.addColorStop(.45, C.on); base.addColorStop(1, shade(C.on, .55)); }
    else { base.addColorStop(0, shade(C.dim, 1.5)); base.addColorStop(1, '#070808'); }
    g.fillStyle = base; g.beginPath(); g.arc(cx, cy, r, 0, 7); g.fill();
    // LED hex grid
    g.save(); g.beginPath(); g.arc(cx, cy, r * .97, 0, 7); g.clip();
    const sp = r / 7.2, dot = sp * .36;
    for (let row = -9, i = 0; row <= 9; row++) {
      const yy = cy + row * sp * .866;
      for (let col = -9; col <= 9; col++) {
        const xx = cx + col * sp + (row & 1 ? sp / 2 : 0);
        const d = Math.hypot(xx - cx, yy - cy); if (d > r * .93) continue;
        if (lit) { g.fillStyle = hexA('#ffffff', .55 - d / r * .35); }
        else { g.fillStyle = hexA(C.on, .09); }
        g.beginPath(); g.arc(xx, yy, dot, 0, 7); g.fill();
        if (!lit) { g.fillStyle = 'rgba(255,255,255,.035)'; g.beginPath(); g.arc(xx - dot * .3, yy - dot * .3, dot * .45, 0, 7); g.fill(); }
      }
    }
    // concentric lens ribs (fresnel)
    g.strokeStyle = lit ? 'rgba(255,255,255,.10)' : 'rgba(255,255,255,.035)'; g.lineWidth = 1;
    for (let k = 1; k < 5; k++) { g.beginPath(); g.arc(cx, cy, r * k / 5, 0, 7); g.stroke(); }
    g.restore();
    // glass reflection
    const refl = g.createLinearGradient(cx - r, cy - r, cx + r * .2, cy + r * .2);
    refl.addColorStop(0, 'rgba(255,255,255,.22)'); refl.addColorStop(.45, 'rgba(255,255,255,.04)'); refl.addColorStop(.55, 'rgba(255,255,255,0)');
    g.fillStyle = refl; g.beginPath(); g.arc(cx, cy, r, 0, 7); g.fill();
    // hood shadow on top edge
    const hs = g.createLinearGradient(0, cy - r, 0, cy - r * .2);
    hs.addColorStop(0, 'rgba(0,0,0,.55)'); hs.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = hs; g.beginPath(); g.arc(cx, cy, r, 0, 7); g.fill();
    spriteCache[key] = { c, pad };
    return spriteCache[key];
  }
  function hexA(hex, a) { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16},${n >> 8 & 255},${n & 255},${Math.max(0, a)})`; }
  function shade(hex, k) { const n = parseInt(hex.slice(1), 16); const f = v => Math.max(0, Math.min(255, Math.round(v * k))); return `rgb(${f(n >> 16)},${f(n >> 8 & 255)},${f(n & 255)})`; }

  // ---------- layout ----------
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 3);
    W = innerWidth; H = innerHeight;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    for (const k in spriteCache) delete spriteCache[k];
    const horiz = shape === 'h' || (shape === 'auto' && W >= H);
    const avH = H - 110; // leave room for the bar
    if (horiz) {
      const bw = Math.min(W * .94, avH / (arrowOn ? .62 : .42) * 1, 1400);
      const bh = bw * .34, r = bh * .36;
      const x = (W - bw) / 2, y = Math.max(20, (avH - bh - (arrowOn ? bh * .62 : 0)) / 2 + 10);
      const lamps = ['green', 'yellow', 'red'].map((k, i) => ({ k, cx: x + bw * (i * 2 + 1) / 6, cy: y + bh / 2, r }));
      const ar = r * .62, ay = y + bh + bh * .12 + ar * 1.05, abw = bw * .66, ax = x + bw - abw;
      const arrows = arrowOn ? ['left', 'up', 'right'].map((d, i) => ({ d, cx: ax + abw * (i * 2 + 1) / 6, cy: ay, r: ar })) : [];
      layout = { horiz, body: { x, y, w: bw, h: bh }, lamps, arrows, abody: arrowOn ? { x: ax, y: ay - ar * 1.3, w: abw, h: ar * 2.6 } : null };
    } else {
      const bh = Math.min(avH * .92, W * .9 / (.34 * (arrowOn ? 2.2 : 1)), 1400);
      const bw = bh * .34, r = bw * .36;
      const extra = arrowOn ? bw * 1.05 : 0;
      const x = (W - bw - extra) / 2, y = Math.max(16, (avH - bh) / 2 + 6);
      const lamps = ['red', 'yellow', 'green'].map((k, i) => ({ k, cx: x + bw / 2, cy: y + bh * (i * 2 + 1) / 6, r }));
      const ar = r * .62, ax = x + bw + bw * .12, abh = bh * .66, ayTop = y + bh - abh;
      const arrows = arrowOn ? ['left', 'up', 'right'].map((d, i) => ({ d, cx: ax + ar * 1.3, cy: ayTop + abh * (i * 2 + 1) / 6, r: ar })) : [];
      layout = { horiz, body: { x, y, w: bw, h: bh }, lamps, arrows, abody: arrowOn ? { x: ax, y: ayTop, w: ar * 2.6, h: abh } : null };
    }
  }

  // ---------- drawing ----------
  function roundRect(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
  function housing(b) {
    // mount bracket
    ctx.fillStyle = '#2a2e33';
    if (layout.horiz) { ctx.fillRect(b.x + b.w * .45, b.y - b.h * .28, b.w * .1, b.h * .3); ctx.fillRect(0, b.y - b.h * .34, W, b.h * .08); }
    else { ctx.fillRect(b.x + b.w * .38, b.y - 40, b.w * .24, 44); }
    const g = ctx.createLinearGradient(0, b.y, 0, b.y + b.h);
    g.addColorStop(0, '#50565d'); g.addColorStop(.08, '#41464c'); g.addColorStop(.9, '#2d3136'); g.addColorStop(1, '#23262a');
    ctx.fillStyle = g; roundRect(b.x, b.y, b.w, b.h, Math.min(b.w, b.h) * .12); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.08)'; ctx.lineWidth = 1.5; ctx.stroke();
    // panel seam lines
    ctx.strokeStyle = 'rgba(0,0,0,.35)'; ctx.lineWidth = 2;
    if (layout.horiz) for (let i = 1; i < 3; i++) { ctx.beginPath(); ctx.moveTo(b.x + b.w * i / 3, b.y + 6); ctx.lineTo(b.x + b.w * i / 3, b.y + b.h - 6); ctx.stroke(); }
    else for (let i = 1; i < 3; i++) { ctx.beginPath(); ctx.moveTo(b.x + 6, b.y + b.h * i / 3); ctx.lineTo(b.x + b.w - 6, b.y + b.h * i / 3); ctx.stroke(); }
    // bolts
    ctx.fillStyle = '#1f2226';
    [[.03, .1], [.97, .1], [.03, .9], [.97, .9]].forEach(([u, v]) => { ctx.beginPath(); ctx.arc(b.x + b.w * u, b.y + b.h * v, Math.min(b.w, b.h) * .018, 0, 7); ctx.fill(); });
  }
  function hood(cx, cy, r) {
    // recess ring
    ctx.fillStyle = '#0d0f11'; ctx.beginPath(); ctx.arc(cx, cy, r * 1.1, 0, 7); ctx.fill();
    // visor seen from the front: crescent over the top
    const g = ctx.createLinearGradient(0, cy - r * 1.3, 0, cy);
    g.addColorStop(0, '#34383d'); g.addColorStop(1, '#16181b');
    ctx.fillStyle = g; ctx.beginPath();
    ctx.arc(cx, cy, r * 1.26, Math.PI * .98, Math.PI * 2.02);
    ctx.arc(cx, cy + r * .08, r * 1.1, Math.PI * 2.02, Math.PI * .98, true);
    ctx.closePath(); ctx.fill();
  }
  function drawLamp(L, lit, alpha) {
    hood(L.cx, L.cy, L.r);
    const off = lampSprite(L.k, L.r, false);
    ctx.drawImage(off.c, L.cx - L.r - off.pad, L.cy - L.r - off.pad, (L.r + off.pad) * 2, (L.r + off.pad) * 2);
    if (lit && alpha > 0) {
      const on = lampSprite(L.k, L.r, true);
      ctx.globalAlpha = alpha;
      ctx.drawImage(on.c, L.cx - L.r - on.pad, L.cy - L.r - on.pad, (L.r + on.pad) * 2, (L.r + on.pad) * 2);
      ctx.globalAlpha = 1;
    }
  }
  function drawArrowLamp(A, lit, alpha) {
    hood(A.cx, A.cy, A.r);
    ctx.fillStyle = '#060707'; ctx.beginPath(); ctx.arc(A.cx, A.cy, A.r, 0, 7); ctx.fill();
    const ang = { left: Math.PI, up: -Math.PI / 2, right: 0 }[A.d];
    const path = () => {
      ctx.save(); ctx.translate(A.cx, A.cy); ctx.rotate(ang);
      const s = A.r; ctx.beginPath();
      ctx.moveTo(s * .62, 0); ctx.lineTo(s * .05, -s * .52); ctx.lineTo(s * .05, -s * .2); ctx.lineTo(-s * .6, -s * .2);
      ctx.lineTo(-s * .6, s * .2); ctx.lineTo(s * .05, s * .2); ctx.lineTo(s * .05, s * .52); ctx.closePath();
      ctx.restore();
    };
    path(); ctx.fillStyle = hexA(COL.green.on, .1); ctx.fill();
    if (lit && alpha > 0) {
      ctx.save(); ctx.globalAlpha = alpha;
      ctx.shadowColor = COL.green.on; ctx.shadowBlur = A.r * .8;
      path(); ctx.fillStyle = COL.green.on; ctx.fill();
      ctx.shadowBlur = 0;
      path(); ctx.save(); ctx.clip();
      const sp = A.r / 6; ctx.fillStyle = 'rgba(255,255,255,.4)';
      for (let yy = -A.r; yy < A.r; yy += sp * .866) for (let xx = -A.r; xx < A.r; xx += sp) { ctx.beginPath(); ctx.arc(A.cx + xx, A.cy + yy, sp * .3, 0, 7); ctx.fill(); }
      ctx.restore(); ctx.restore();
    }
    const refl = ctx.createLinearGradient(A.cx - A.r, A.cy - A.r, A.cx, A.cy);
    refl.addColorStop(0, 'rgba(255,255,255,.14)'); refl.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = refl; ctx.beginPath(); ctx.arc(A.cx, A.cy, A.r, 0, 7); ctx.fill();
  }
  function draw() {
    const bg = ctx.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, '#171b21'); bg.addColorStop(1, '#0a0c0e');
    ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
    // light spill on the background from the lit lamp
    const litLamp = layout.lamps.find(L => isLit(L.k));
    if (litLamp) {
      const sp = ctx.createRadialGradient(litLamp.cx, litLamp.cy, 0, litLamp.cx, litLamp.cy, Math.max(W, H) * .6);
      sp.addColorStop(0, hexA(COL[litLamp.k].on, .10 * fade)); sp.addColorStop(1, hexA(COL[litLamp.k].on, 0));
      ctx.fillStyle = sp; ctx.fillRect(0, 0, W, H);
    }
    housing(layout.body);
    layout.lamps.forEach(L => drawLamp(L, isLit(L.k), fade));
    if (layout.abody) {
      const b = layout.abody;
      const g = ctx.createLinearGradient(0, b.y, 0, b.y + b.h); g.addColorStop(0, '#474c52'); g.addColorStop(1, '#2a2d31');
      ctx.fillStyle = g; roundRect(b.x, b.y, b.w, b.h, Math.min(b.w, b.h) * .14); ctx.fill();
      layout.arrows.forEach(A => drawArrowLamp(A, state === 'arrow' && A.d !== 'left', fade));
    }
  }
  const isLit = k => (k === 'green' && state === 'green') || (k === 'yellow' && state === 'yellow') || (k === 'red' && (state === 'red' || state === 'arrow'));

  // ---------- state ----------
  function next() {
    const order = arrowOn ? ['green', 'yellow', 'red', 'arrow'] : ['green', 'yellow', 'red'];
    let i = order.indexOf(state); if (i < 0) i = order.length - 1;
    setState(order[(i + 1) % order.length]);
  }
  function setState(s) { if (s === state) { t = 0; return; } state = s; t = 0; fade = 0; }
  function dur() { const S = SPEEDS[speed]; return { green: S.g, yellow: S.y, red: arrowOn ? S.r * .6 : S.r, arrow: S.a }[state]; }

  let last = performance.now();
  function frame(now) {
    const dt = Math.min(.1, (now - last) / 1000); last = now;
    t += dt; fade = Math.min(1, fade + dt / .08);
    if (auto && t > dur()) next();
    draw();
    requestAnimationFrame(frame);
  }

  // ---------- controls ----------
  let hideT = null;
  function showBar() { bar.classList.remove('hide'); clearTimeout(hideT); hideT = setTimeout(() => bar.classList.add('hide'), 5000); }
  function inSignal(x, y) {
    const b = layout.body; if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) return true;
    const a = layout.abody; return !!a && x >= a.x && x <= a.x + a.w && y >= a.y && y <= a.y + a.h;
  }
  cv.addEventListener('pointerdown', e => {
    wake();
    hint.style.opacity = 0;
    if (inSignal(e.clientX, e.clientY)) next(); else showBar();
  });
  bar.addEventListener('pointerdown', showBar);
  const press = (el, on) => el.setAttribute('aria-pressed', on ? 'true' : 'false');
  $('bAuto').onclick = () => { auto = !auto; press($('bAuto'), auto); $('bAuto').textContent = auto ? 'じどう' : 'てどう（タップでかわる）'; t = 0; };
  $('bSpeed').onclick = () => { speed = (speed + 1) % 3; $('bSpeed').textContent = 'はやさ：' + SPEEDS[speed].name; };
  $('bArrow').onclick = () => { arrowOn = !arrowOn; press($('bArrow'), arrowOn); if (!arrowOn && state === 'arrow') setState('red'); resize(); };
  $('bShape').onclick = () => { shape = shape === 'auto' ? 'h' : shape === 'h' ? 'v' : 'auto'; $('bShape').textContent = 'かたち：' + { auto: 'じどう', h: 'よこ', v: 'たて' }[shape]; resize(); };
  $('bG').onclick = () => setState('green');
  $('bY').onclick = () => setState('yellow');
  $('bR').onclick = () => setState('red');
  $('bFull').onclick = () => { const d = document.documentElement; try { (d.requestFullscreen || d.webkitRequestFullscreen).call(d); } catch (e) {} };
  // keep the screen on while playing
  let lock = null;
  async function wake() { try { if (!lock && navigator.wakeLock) { lock = await navigator.wakeLock.request('screen'); lock.addEventListener('release', () => lock = null); } } catch (e) {} }
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { lock = null; wake(); } });

  addEventListener('resize', resize);
  resize(); showBar();
  requestAnimationFrame(frame);
})();
</script>

<script>
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}
</script>
</body>
